# 把下面 [Rule] 段贴进你的 Surge6-MY.conf, 替换原来的远程规则
# 仓库: https://github.com/doubi-rule/surge-rules  分支 main
# Surge 引用格式: RULE-SET,<地址>,<策略>  -- 策略在配置里定, list 文件本身不带策略列
# 顺序最重要: Microsoft 放最前面, 学校邮箱 / 学校账号登录永远 DIRECT, 永不走代理、永不拦截

[Rule]
# 0. Microsoft 365 / 学校账号 - 最重要, 放最前面
RULE-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/rules/microsoft.list,DIRECT
RULE-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/rules/school.list,DIRECT
# 1. 广告 / 追踪拦截
RULE-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/rules/reject.list,REJECT
# 2. 马来西亚本地直连
RULE-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/rules/my-direct.list,DIRECT
# 3. Apple
RULE-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/rules/apple.list,DIRECT
# 4. AI
RULE-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/rules/ai.list,🤖 AI
# 5. 流媒体
RULE-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/rules/streaming.list,🎬 流媒体
# 6. 其他走代理的
RULE-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/rules/proxy.list,Proxy
# 可选上游: 如果你跑了 sync-upstream.sh, 再加这一行
# RULE-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/rules/reject-upstream.list,REJECT
GEOIP,MY,DIRECT,no-resolve
FINAL,DIRECT
# 刷新方式: Surge > 配置 > 更新规则集, 或在 RULE-SET 后加 ,update-interval=86400
# 例如: RULE-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/rules/microsoft.list,DIRECT,update-interval=86400
