# Surge DOMAIN-SET 版本 - 和 RULE-SET 版本二选一, 不要两个都用
# 区别: RULE-SET 文件里是 DOMAIN-SUFFIX,xxx ; DOMAIN-SET 文件里是 .xxx , 格式不能混用
# 同一个 URL 不能既当 RULE-SET 又当 DOMAIN-SET, 所以这套是单独的 domain-set/ 目录
# DOMAIN-SET 对大列表更快, 你的小列表用哪个都行, reject-upstream (20 万条) 用 DOMAIN-SET 更合适
# 仓库: https://github.com/doubi-rule/surge-rules  分支 main
# 顺序和 RULE-SET 版一样: Microsoft / 学校最前面, 永远 DIRECT

[Rule]
# 0. Microsoft 365 / 学校账号 - 最重要, 放最前面
DOMAIN-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/domain-set/microsoft.txt,DIRECT
DOMAIN-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/domain-set/school.txt,DIRECT
# 1. 广告 / 追踪拦截
DOMAIN-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/domain-set/reject.txt,REJECT
# 2. 马来西亚本地直连
DOMAIN-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/domain-set/my-direct.txt,DIRECT
# 3. Apple
DOMAIN-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/domain-set/apple.txt,DIRECT
# 4. AI (含 Muse / Meta AI)
DOMAIN-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/domain-set/ai.txt,🤖 AI
# 5. 流媒体
DOMAIN-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/domain-set/streaming.txt,🎬 流媒体
# 5b. 中国抖音 - 走 🎵 抖音组, 手动 select, 固定节点
DOMAIN-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/domain-set/douyin.txt,🎵 抖音
# 6. 其他走代理的
DOMAIN-SET,https://raw.githubusercontent.com/doubi-rule/surge-rules/main/domain-set/proxy.txt,Proxy
GEOIP,MY,DIRECT,no-resolve
FINAL,DIRECT
# 刷新方式: Surge > 配置 > 更新规则集
